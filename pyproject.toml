[project]
name = "sens-mms"
version = "0.1.0"
description = "Fail-closed NAVER Cloud SENS MMS delivery workflow"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "tzdata>=2026.3,<2027",
]

[project.scripts]
sens-mms = "sens_mms.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sens_mms"
module-root = ""
